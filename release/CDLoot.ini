; ============================================================================
;
;   CDLoot - auto-loot for Crimson Desert / автосбор для Crimson Desert
;
;   EN: This file sits next to the mod in bin64 and is read when the game
;       starts. Change a value, restart the game.
;   RU: Файл лежит рядом с модом, в bin64, и читается при запуске игры.
;       Поправил значение - перезапустил игру.
;
; ============================================================================

[CDLoot]

; --- keys / клавиши ---------------------------------------------------------
;
; EN: Two keys, both can be reassigned. Write the name exactly as printed in
;     the left column.
; RU: Две клавиши, обе переназначаются. Пишите имя ровно так, как оно
;     напечатано в левом столбце.
;
;     F1  F2  F3  ...  F24
;     A  B  C  ...  Z
;     0  1  2  ...  9
;     NUM0  NUM1  ...  NUM9   ->   0 ... 9
;     NUMPLUS                 ->   +
;     NUMMINUS                ->   -
;     NUMMULT                 ->   *
;     NUMDIV                  ->   /
;     NUMDOT                  ->   .
;     HOME  END  INSERT  DELETE  PAGEUP  PAGEDOWN
;     TAB  SPACE  BACKSPACE  SCROLLLOCK  PAUSE
;     MOUSE3                  ->   EN: middle button / wheel click
;                                  RU: средняя кнопка / щелчок колесом
;     MOUSE4                  ->   EN: side button, "back"
;                                  RU: боковая кнопка, "назад"
;     MOUSE5                  ->   EN: side button, "forward"
;                                  RU: боковая кнопка, "вперёд"
;
; EN: NUM... is the numeric keypad on the right of the keyboard, and it works
;     with Num Lock on. An unrecognised name is ignored, the previous key
;     stays, and the log says so. Avoid keys the game itself uses.
; RU: NUM... - это цифровой блок справа на клавиатуре, работает при
;     включённом Num Lock. Непонятое имя игнорируется, остаётся прежняя
;     клавиша, в лог пишется сообщение. Не занимайте клавиши, которые
;     использует сама игра.
;
; EN: About the mouse. Left and right buttons are deliberately not offered -
;     the game uses them. Windows itself only distinguishes five buttons, so
;     a sixth or seventh button on a gaming mouse cannot be read directly.
;     If you want to use one, bind it to a keyboard key in your mouse
;     software and put that key here.
; RU: О мыши. Левая и правая намеренно не предлагаются - их занимает игра.
;     Сама Windows различает только пять кнопок, поэтому шестую и седьмую на
;     игровой мыши прочитать напрямую нельзя. Если хочется использовать их,
;     назначьте им клавишу клавиатуры в программе мыши и впишите эту клавишу
;     сюда.

; EN: Auto-loot on / off.
; RU: Автосбор включить / выключить.
KeyAutoLoot=F10

; EN: Grab one burst right now - BurstPerKey objects, nearest first.
; RU: Собрать пачку прямо сейчас - BurstPerKey объектов, ближайшие первыми.
KeyBurst=F11


; --- gamepad / геймпад ------------------------------------------------------
;
; EN: Gamepad buttons work ALONGSIDE the keyboard keys above, not instead of
;     them: both are live at the same time. Leave a line empty or write NONE
;     to bind nothing. Any XInput controller works; nothing extra to install.
; RU: Кнопки геймпада работают ВМЕСТЕ с клавишами выше, а не вместо них: живы
;     обе. Пустая строка или NONE - ничего не назначено. Годится любой
;     контроллер XInput, ставить ничего не нужно.
;
;     PAD_A      PAD_B      PAD_X      PAD_Y
;     PAD_LB     PAD_RB           EN: bumpers        RU: бамперы
;     PAD_LT     PAD_RT           EN: triggers       RU: курки
;     PAD_LS     PAD_RS           EN: stick clicks   RU: нажатие стиков
;     PAD_BACK   PAD_START        EN: View and Menu  RU: View и Menu
;     PAD_UP  PAD_DOWN  PAD_LEFT  PAD_RIGHT     EN: d-pad  RU: крестовина
;
; EN: Combinations with a plus sign, and this is the useful part - single
;     buttons are almost all taken by the game. All buttons of a combination
;     must be held together:
;         PadAutoLoot=PAD_LB+PAD_RB
;         PadBurst=PAD_BACK+PAD_A
;     A trigger counts as pressed from about a quarter of its travel.
; RU: Сочетания через плюс, и в них весь смысл: одиночные кнопки почти все
;     заняты игрой. Все кнопки сочетания должны быть нажаты разом:
;         PadAutoLoot=PAD_LB+PAD_RB
;         PadBurst=PAD_BACK+PAD_A
;     Курок считается нажатым примерно от четверти хода.

; EN: Auto-loot on / off.
; RU: Автосбор включить / выключить.
PadAutoLoot=NONE

; EN: Grab one burst right now.
; RU: Собрать пачку прямо сейчас.
PadBurst=NONE



; --- general / общее --------------------------------------------------------

; EN: Master switch. 0 - the mod does not start at all.
; RU: Мастер-выключатель. 0 - логика не запускается вовсе.
Enabled=1

; EN: Language of the on-screen banner.
;       EN   = English (default)
;       RU   = Russian
;       AUTO = Russian on a Russian Windows, English everywhere else
; RU: Язык таблички на экране.
;       EN   = английский (по умолчанию)
;       RU   = русский
;       AUTO = русский на русской системе, всем остальным английский
Language=EN

; EN: The on-screen banner and its sound. In the release build this banner is
;     the only thing drawn on screen; it shows for two seconds and disappears.
;       1 = show the banner and beep (default)
;       0 = work silently, nothing on screen
; RU: Экранная табличка и звук. В готовой сборке эта табличка - единственное,
;     что рисуется на экране: показывается на две секунды и гаснет.
;       1 = показывать табличку и звук (по умолчанию)
;       0 = работать молча, на экране ничего
BurstNotify=1

; EN: Turn the auto-looter on right at load, without pressing the key.
; RU: Включать автосбор сразу при загрузке, не дожидаясь клавиши.
AutoMode=0


; --- what to collect / что собирать -----------------------------------------

; EN: Searching animal carcasses - the "skin it" interaction. Each carcass is
;     searched once per game session.
;     Human corpses are not this: a killed human drops ordinary loot on the
;     ground, and PickUpItems takes it.
; RU: Обыск звериных туш - то самое "снять шкуру". Каждая туша обыскивается
;     один раз за игровую сессию.
;     Человеческие трупы сюда не относятся: с убитого падает обычный дроп со
;     статусом "взять", и его забирает PickUpItems.
LootCorpses=1

; EN: Picking up items lying on the ground.
; RU: Подбор предметов с земли.
PickUpItems=1

; EN: Gathering plants, ore and stone. The game gives them one type, so one
;     switch covers all three.
; RU: Сбор растений, руды и камня. У игры это один тип, поэтому все три под
;     одним выключателем.
GatherPlants=1

; EN: Catching small creatures: insects, fish, chickens, coots - everything
;     the game puts into the inventory whole.
; RU: Ловля мелкой живности: насекомые, рыба, куры, лысухи - всё, что игра
;     кладёт в инвентарь целиком.
CatchInsects=1

; EN: Furniture, crates, crockery and decor, recognised by item and node name.
;     Off by default: indoors there is more of it than real loot.
; RU: Мебель, ящики, посуда и декор - опознаются по имени предмета и узла.
;     По умолчанию выключено: в помещении такого больше, чем настоящего лута.
LootFurniture=0

; EN: Tools - shovel, pickaxe, hoe, felling axe, work hammer. In the game they
;     share the Equip_ prefix; weapons are named differently and are not
;     affected. Off by default: they are heavy, cheap and lie around every camp.
; RU: Инструменты - лопата, кирка, мотыга, топор дровосека, рабочий молот. В
;     игре у них общий префикс Equip_; оружие названо иначе и под фильтр не
;     попадает. По умолчанию выключено: они тяжёлые, дешёвые и валяются возле
;     каждой стоянки.
LootTools=0

; EN: Take goods that belong to someone. The mod asks the game itself, the
;     same way it decides whether the prompt says "Take" or "Steal".
;       0 = walk past other people's goods (default, no bounty)
;       1 = take them anyway; the bounty is on you
; RU: Брать чужое. Мод спрашивает саму игру, тем же способом, каким она
;     решает, показать "Взять" или "Украсть".
;       0 = обходить чужое (по умолчанию, без розыска)
;       1 = брать всё подряд, розыск на твоей совести
LootOwned=0

; EN: Quest items, artifacts, sealed objects, recipe books and puzzle or
;     mechanism parts are never taken automatically. This is enforced in code
;     and has no switch; they remain available by hand.
; RU: Квестовые предметы, артефакты, запечатанные объекты, книги рецептов и
;     детали механизмов и головоломок автосбором не берутся никогда. Запрет
;     стоит в коде и ключа не имеет; руками они по-прежнему доступны.



; --- ranges, in game metres / расстояния, в игровых метрах -------------------

; EN: Survey radius: what gets into the working list at all. Keep it wider
;     than the ranges below; larger working ranges are clamped to it.
; RU: Радиус обзора: что вообще попадает в рабочий список. Держите его шире
;     радиусов ниже; рабочие радиусы больше обзора урезаются до него.
ScanRange=40

; EN: Below - a separate radius per kind of loot. 0 = no limit.
; RU: Дальше - свой радиус на каждый вид добычи. 0 = без ограничения.

; EN: Items on the ground.
; RU: Вещи на земле.
LootRange=15

; EN: Gathering: plants, ore, stone.
; RU: Сбор: растения, руда, камень.
GatherRange=20

; EN: Catching small creatures.
; RU: Ловля мелкой живности.
CatchRange=8

; EN: Searching animal carcasses.
; RU: Обыск звериных туш.
CorpseRange=12

; EN: Dead zone around the player. Objects closer than this are not touched.
;     The player's own equipment is recognised by other means; this is only a
;     safety net, and 0 turns it off.
; RU: Мёртвая зона вокруг игрока: ближе этого объекты не трогаются.
;     Собственное снаряжение опознаётся другими способами, это лишь
;     страховка; 0 - выключить.
MinRange=0.35


; --- pace / темп ------------------------------------------------------------
;
; EN: Two keys, and they multiply. One says how OFTEN the mod looks around,
;     the other how MUCH it takes each time it looks.
;
;         items per second  =  PerTick x MaxLootsPerSec
;
;     Looking around is the expensive half: a sweep walks the whole scene on
;     the game thread and costs 7..50 ms. Taking is the cheap half: the scene
;     is already swept, and one more event costs a fraction of a millisecond.
;     So raise PerTick first, and lower MaxLootsPerSec first if frames drop.
;
; RU: Два ключа, и они перемножаются. Один говорит, как ЧАСТО мод смотрит по
;     сторонам, второй - сколько он берёт за один такой взгляд.
;
;         предметов в секунду  =  PerTick x MaxLootsPerSec
;
;     Смотреть по сторонам - дорогая половина: обход проходит по всей сцене
;     на игровом потоке и стоит 7..50 мс. Брать - дешёвая: сцена уже пройдена,
;     и лишнее событие стоит долей миллисекунды. Поэтому поднимать надо
;     сначала PerTick, а при просадке кадров сначала опускать MaxLootsPerSec.

; EN: How often the mod looks around, times per second. 1..20, or 0.
;       0  = every frame. Fastest reaction, highest cost.
;       20 = a sweep every 50 ms.
;       5  = a sweep every 200 ms.
;     This key sets how SOON a new object is noticed, not how much is taken.
; RU: Как часто мод смотрит по сторонам, раз в секунду. 1..20 либо 0.
;       0  = каждый кадр. Быстрее всего и дороже всего.
;       20 = обход каждые 50 мс.
;       5  = обход каждые 200 мс.
;     Этот ключ задаёт, насколько БЫСТРО замечается новое, а не сколько
;     берётся.
MaxLootsPerSec=5

; EN: How many objects are taken per one sweep. 0..64.
;       0 = no limit: everything the rules allow, in one go.
;     With 0 the mod is already as greedy as it can be, and only
;     MaxLootsPerSec still limits it.
; RU: Сколько объектов берётся за один обход. 0..64.
;       0 = без ограничения: всё разрешённое, за один раз.
;     При 0 мод уже жаден настолько, насколько может, и ограничивает его
;     только MaxLootsPerSec.
PerTick=0

; EN: How many objects one burst key press takes, nearest first. 0..32.
;       0 = no limit: everything in reach, in one press.
; RU: Сколько объектов берёт одно нажатие клавиши пачки, ближайшие первыми.
;     0..32.
;       0 = без ограничения: всё, до чего дотягивается, за одно нажатие.
BurstPerKey=0

; EN: How many milliseconds before the same object may be tried again. The
;     game does not remove collected things instantly.
; RU: Через сколько миллисекунд разрешено повторно взяться за тот же объект.
;     Игра убирает собранное не мгновенно.
RetryAfterMs=6000


; --- reach / дотягивание ----------------------------------------------------

; EN: Make an interaction available without waiting for the game to do it.
;     The game fills in a node's data only when it considers the interaction
;     reachable - for an ore vein that means standing on top of it.
;       1 = do it ourselves (default)
;       0 = wait until the game allows it
; RU: Делать взаимодействие доступным, не дожидаясь игры. Игра наполняет
;     данные на узле только когда считает взаимодействие достижимым - у
;     рудной жилы это значит встать на неё сверху.
;       1 = делать самим (по умолчанию)
;       0 = ждать, пока разрешит игра
AutoArm=1

; EN: Mechanism containers - a well bucket and the like. The mod NEVER loots
;     them: the object itself has to stay where it is, or the mechanism it
;     belongs to breaks. But arming one is useful - the game then offers the
;     interaction, and you take the contents by hand.
;       1 = arm them, so they are ready for you (default)
;       0 = do not touch them at all
; RU: Ёмкости механизмов - колодезное ведро и подобное. Мод НИКОГДА их не
;     лутает: сам объект должен остаться на месте, иначе ломается механизм,
;     частью которого он является. А вот зарядить такую полезно - игра после
;     этого предлагает взаимодействие, и содержимое вы берёте руками.
;       1 = заряжать, чтобы были готовы к использованию (по умолчанию)
;       0 = не трогать вовсе
ArmContainers=1

; EN: Do the scene sweep on the mod's own thread instead of inside the game's
;     frame. The sweep costs 10-20 ms, and on the game thread that is a whole
;     frame at 60 fps - the reason the mod used to stutter in combat and in
;     towns. Sending events and arming still happen on the game thread, as
;     they must.
;       1 = own thread (default, recommended)
;       0 = old behaviour, everything inside the game's frame
; RU: Считать обход сцены в своём потоке, а не внутри игрового кадра. Обход
;     стоит 10-20 мс, а на игровом потоке это целый кадр при 60 fps - отсюда
;     и были подтормаживания в бою и в городе. Отправка событий и зарядка
;     узлов по-прежнему идут на игровом потоке, иначе нельзя.
;       1 = свой поток (по умолчанию, так лучше)
;       0 = как раньше, всё внутри игрового кадра
ScanOffThread=1

; EN: How far AutoArm may reach. It does not account for walls, so a large
;     value lets the mod collect through them, from the next room or outside.
;       0 = no limit, falls back to GatherRange
; RU: На каком расстоянии работает AutoArm. Стены он не учитывает, поэтому
;     большое значение позволяет собирать сквозь них - из соседней комнаты
;     или с улицы.
;       0 = без ограничения, берётся GatherRange
ArmRange=8


; ============================================================================
;   DEVELOPER SECTION / РАЗДЕЛ РАЗРАБОТЧИКА
;
;   EN: Nothing below is needed to play. Leave Debug=0 and ignore the rest.
;   RU: Ничего ниже для игры не нужно. Оставьте Debug=0 и не читайте дальше.
; ============================================================================

; EN: Log verbosity, and the developer keys.
;       1 = full log: structure dumps, timings, every decision. Grows fast.
;           ALSO enables the keys listed below.
;       0 = what was taken, what was refused, and errors. (default)
; RU: Разговорчивость лога и клавиши разработчика.
;       1 = полный лог: разбор структур, тайминги, каждое решение. Растёт
;           быстро. ЗАОДНО включает клавиши из списка ниже.
;       0 = что взято, что запрещено, ошибки. (по умолчанию)
Debug=0

; EN: Draw marks on every object the mod can take, plus a crosshair. A
;     reconnaissance tool: in a crowded place it covers the screen with
;     dozens of crosses and labels. When off, none of it is COMPUTED either -
;     no camera search, no aim, no screen coordinates.
;     Numpad2 toggles it in game. Needs Debug=1 either way.
; RU: Рисовать метки на всех объектах, которые мод может взять, плюс
;     перекрестье. Инструмент разведки: в густом месте закрывает экран
;     десятками крестов с подписями. Когда выключено, оно и НЕ СЧИТАЕТСЯ:
;     ни поиск камеры, ни прицел, ни экранные координаты.
;     Numpad2 переключает на лету. В любом случае нужен Debug=1.
ShowMarks=0

;   EN: Keys that appear only with Debug=1. They write a lot to the log and
;       some of them read the game's memory directly. They are not
;       reassignable and are kept for development.
;   RU: Клавиши, работающие только при Debug=1. Они много пишут в лог, часть
;       из них читает память игры напрямую. Не переназначаются, оставлены
;       для разработки.
;
;     F4    EN: auto-loot on / off        RU: автосбор вкл / выкл
;     F8    EN: take the nearest one      RU: взять ближайшее
;     F5    EN: take nearest non-plant    RU: взять ближайшее, кроме растений
;     F3    EN: show / hide the overlay   RU: показать / скрыть плашку
;     F9    EN: survey everything nearby  RU: обзор всего вокруг
;     F2    EN: details on the aimed and nearest objects
;           RU: подробно о наведённом и ближайших объектах
;     F6    EN: build an event and show it without sending
;           RU: собрать событие и показать, не отправляя
;     F7    EN: record the game's own events for ten seconds
;           RU: записать события самой игры за десять секунд
;     F11   EN: memory watch on a node    RU: сторож памяти на узел
;     Num0  EN: take what you are aiming at, ignoring owner and ranges.
;                Postponed: the aim picks the object nearest the crosshair by
;                angle, and without the overlay marks you cannot see which.
;           RU: взять то, на что смотришь, не глядя на владельца и радиусы.
;                Отложено: прицел берёт ближайший к перекрестью объект по
;                углу, и без меток на экране не видно, какой именно.
;     Num1  EN: arm the node you are aiming at
;           RU: зарядить узел, на который смотришь
;     Num2  EN: marks and camera on / off
;           RU: метки и камера вкл / выкл
;     Num5  EN: arm the nearest node by hand
;           RU: зарядить ближайший узел вручную
;     Num6  EN: look for the game's own aimed target
;           RU: искать наведённую цель самой игры
;     Num7  EN: locate the camera          RU: найти камеру
;     Num8  EN: print the camera's state   RU: напечатать состояние камеры
;
;   EN: With Debug=1 the overlay also draws a crosshair and marks every object
;       it can take, with distance. That is a development tool, not a feature.
;   RU: При Debug=1 плашка дополнительно рисует перекрестье и метки на всех
;       объектах, которые может взять, с расстоянием. Это инструмент
;       разработки, а не возможность мода.
